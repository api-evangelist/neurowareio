name: Neuroware.io
description: >-
  Neuroware is a Malaysia-based blockchain infrastructure provider that has been
  building distributed-ledger applications since 2010, working with government
  agencies and regulated fintech operators. Its flagship Cortex platform offers a
  unified interface for managing multiple blockchains and protocols, powered by
  private, use-case-customized APIs delivering identity, authentication and role
  management, distributed data and document storage, custom token generation and
  analytics, and cryptographic keyless e-wallets. Related products include COKEEPS
  (regulated digital-asset custody), OVIATO (PassKey-native self-custody wallet
  infrastructure), and R1 (training and consultancy). Neuroware also created the
  earlier Blockstrap blockchain application stack and API. No current public,
  documented API or OpenAPI surface is published; APIs are delivered privately per
  engagement.
